<title>Colombia en disputa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0d1319; --sea:#0d1319; --panel:#141c24; --panel-2:#1a242e;
  --land:#1c2631; --land-edge:#2f3d4b;
  --ink:#efeadf; --ink-2:#b4bbc0; --ink-3:#7c868e; --rule:#2a3540;
  --gold:#e8b93e; --gold-fill:rgba(232,185,62,.22);
  --lib:#e5534b; --con:#4f8ff7; --real:#f1eee6; --fa:#62cdb8; --fb:#c29cf2;
  --win:#5cc48d; --lose:#ef6b61; --mixed:#d9c068;
  --e-col:#3987e5; --e-ind:#d95926; --e-civ:#199e70; --e-ter:#c98500; --e-vio:#d55181; --e-arm:#1f9a2f;
  --k1:#3987e5; --k2:#d95926; --k3:#199e70; --k4:#c98500; --k5:#d55181; --k6:#2f9a3a; --k7:#9085e9; --k8:#e66767;
  --display:"Alegreya","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sc:"Alegreya SC","Alegreya",Georgia,serif;
  --sans:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.scrolly{display:grid;grid-template-columns:minmax(360px,460px) minmax(0,1fr);max-width:1680px;margin:0 auto}
.stage{grid-column:2;grid-row:1;align-self:start;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden;background:var(--sea)}
.steps{grid-column:1;grid-row:1;padding-inline:24px;padding-block:0 30vh;position:relative;z-index:2}
.step{min-height:92svh;display:flex;align-items:center;padding-block:10svh}
.step:first-child{min-height:100svh;padding-top:max(6svh,76px)}

/* map */
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#world path{fill:var(--land);stroke:var(--land-edge);stroke-width:calc(var(--sw,1) * .8px);stroke-linejoin:round;transition:fill .9s ease, stroke .9s ease}
#world path.col{fill:var(--gold-fill);stroke:var(--gold);stroke-width:calc(var(--sw,1) * 1.3px)}
#world path.ghost{fill:#222d38;stroke:var(--gold);stroke-dasharray:calc(var(--sw,1)*4px) calc(var(--sw,1)*3px);stroke-width:calc(var(--sw,1) * 1px)}
#world path.lost{animation:lost 2.6s ease both}
@keyframes lost{0%{fill:var(--gold-fill);stroke:var(--gold)}30%{fill:rgba(239,107,97,.55);stroke:var(--lose)}60%{fill:rgba(239,107,97,.4);stroke:var(--lose)}100%{fill:var(--land);stroke:var(--land-edge)}}
#deps path{fill:transparent;fill-opacity:.55;stroke:transparent;stroke-width:calc(var(--sw,1) * .6px);stroke-linejoin:round;transition:fill .8s ease, stroke .8s ease, fill-opacity .3s}
#deps.show path{stroke:rgba(239,234,223,.16)}
#deps path.on{stroke:rgba(13,19,25,.9);stroke-width:calc(var(--sw,1) * .9px)}
#deps path.on:hover{fill-opacity:.8}
#muns path{fill:var(--gold);fill-opacity:.55;stroke:var(--gold);stroke-width:calc(var(--sw,1) * 1.2px);opacity:0;transition:opacity .8s}
#muns.show path{opacity:1}
.route{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:calc(var(--sw,1) * 3px);stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw var(--dur,2.6s) cubic-bezier(.45,.05,.3,1) var(--delay,0s) forwards}
.route-shadow{fill:none;stroke:var(--bg);stroke-opacity:.7;stroke-width:calc(var(--sw,1) * 7px);stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw var(--dur,2.6s) cubic-bezier(.45,.05,.3,1) var(--delay,0s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.area{fill:rgba(232,185,62,.14);stroke:var(--gold);stroke-width:calc(var(--sw,1)*1.5px);stroke-dasharray:calc(var(--sw,1)*6px) calc(var(--sw,1)*4px);animation:fade .8s ease both}
.traveler{fill:var(--ink)}

#ov text{font-family:var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.clab{font-family:var(--sc)!important;font-size:13px;letter-spacing:.14em;fill:var(--ink-3)}
.slab{font-family:var(--sc)!important;font-size:12px;letter-spacing:.1em;fill:var(--ink)}
.tlab{font-family:var(--display)!important;font-style:italic;font-size:26px;fill:var(--gold);opacity:.75}
.mk .lab{font-size:14px;font-weight:500;fill:var(--ink)}
.mk .sub{font-size:12.5px;fill:var(--ink-2)}
.mk .people{font-family:var(--display);font-style:italic;font-size:17px;fill:#f0d58a}
.mk.ev-mk{cursor:pointer}
.mk .hit{fill:transparent}
.mk .sym{transition:transform .25s ease;transform-box:fill-box;transform-origin:center}
.mk.hot .sym{transform:scale(1.7)}
.mk.hot .lab{fill:var(--gold)}
.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.fadein{animation:fade .6s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pulse{fill:none;stroke-width:2;animation:pulse 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.4);opacity:.95}100%{transform:scale(2.6);opacity:0}}
.leaving{animation:out .35s ease forwards}
@keyframes out{to{opacity:0}}

/* HUD */
.hud{position:absolute;left:28px;top:22px;pointer-events:none;display:flex;flex-direction:column;gap:2px}
.hud .era{font-family:var(--sc);font-size:15px;letter-spacing:.12em;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.hud .era i{width:10px;height:10px;border-radius:50%;background:var(--ec,var(--gold))}
.hud .year{font-family:var(--display);font-weight:800;font-size:clamp(46px,6.4vw,92px);line-height:.95;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.hud .year small{font-size:.42em;font-weight:500;color:var(--ink-2);margin-left:6px}
.note{position:absolute;right:18px;bottom:112px;font-size:12px;color:var(--ink-3);text-align:right;pointer-events:none;max-width:44ch}

.mleg{position:absolute;right:24px;bottom:112px;max-width:min(360px,60%);background:rgba(20,28,36,.9);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;transition:opacity .4s}
.mleg[hidden]{display:none!important}
.mleg .its{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,auto));gap:5px 16px}
.stage.has-leg .note{display:none}
.mleg b{font-family:var(--sc);font-weight:500;letter-spacing:.06em;font-size:14px}
.mleg .it{display:flex;gap:8px;align-items:flex-start;line-height:1.3}
.mleg .it i{flex:none;width:12px;height:12px;border-radius:3px;background:var(--c);opacity:.85;margin-top:2px}
.mleg small{color:var(--ink-3);font-size:12px;line-height:1.3}

.popup{position:absolute;z-index:4;max-width:280px;background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:10px 12px 11px;font-size:14.5px;line-height:1.4;box-shadow:0 12px 30px rgba(0,0,0,.5);pointer-events:none}
.popup time{display:block;font-weight:700;color:var(--gold);font-size:13px;font-variant-numeric:tabular-nums}
.popup b{display:block;font-family:var(--display);font-size:17px;margin-bottom:2px}
.dtip{position:absolute;z-index:4;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:5px 8px;border-radius:4px;line-height:1.3;max-width:240px}
.dtip b{display:block}

/* timeline */
.tl{position:absolute;left:24px;right:24px;bottom:18px;height:36px}
.tl .axis{position:absolute;left:0;right:0;top:17px;height:2px;background:var(--rule);border-radius:2px}
.tl .fill{position:absolute;left:0;top:17px;height:2px;background:var(--gold);border-radius:2px;transition:width .9s ease}
.tl button{position:absolute;top:10px;width:14px;height:16px;margin-left:-7px;border:0;background:none;padding:0;display:grid;place-items:center}
.tl button i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--bg);transition:transform .3s}
.tl button.on i{transform:scale(1.9);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.tl .yl{position:absolute;top:26px;font-size:11.5px;color:var(--ink-3);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.tl .brk{position:absolute;top:12px;width:6px;height:12px;margin-left:-3px;border-inline:1.5px solid var(--ink-3);transform:skewX(-20deg);background:var(--bg)}

/* cards */
.card{background:color-mix(in srgb,var(--panel) 95%,transparent);border:1px solid var(--rule);border-radius:10px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35);opacity:.45;transform:translateY(8px);transition:opacity .5s ease, transform .5s ease}
.step.active .card{opacity:1;transform:none}
.kicker{display:flex;align-items:center;gap:8px;font-family:var(--sc);font-size:14.5px;letter-spacing:.1em;color:var(--ink-2)}
.kicker i{width:9px;height:9px;border-radius:50%;background:var(--ec)}
.kicker span{margin-left:auto;font-family:var(--sans);letter-spacing:0;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.card h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(26px,2.5vw,33px);line-height:1.08;text-wrap:balance}
.card .txt{margin:0;color:var(--ink-2);font-size:16.5px}
.card h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(44px,5vw,64px);line-height:.95;letter-spacing:-.01em}
.card h1 em{font-style:italic;font-weight:500;color:var(--gold)}

.hitos{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.hitos button{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:7px 6px;font-size:14.5px;line-height:1.38;color:var(--ink);border-radius:0;transition:background .2s}
.hitos button:hover,.hitos button.on{background:var(--panel-2)}
.hitos time{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;font-size:13px;padding-top:1px}
.hitos button b{font-weight:700}
.hitos button.nomap time::after{content:"";}
.hitos-h{font-family:var(--sc);font-size:13.5px;letter-spacing:.1em;color:var(--ink-3);margin:0 0 -8px}

.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sides.three{grid-template-columns:1fr}
.side{position:relative;border:1px solid var(--rule);border-radius:7px;padding:10px 10px 34px;background:var(--panel-2);display:flex;flex-direction:column;gap:3px;transition:filter .6s ease .9s, opacity .6s ease .9s, border-color .6s ease .9s}
.sides.three .side{padding-bottom:10px;padding-right:118px}
.sides.three .stamp{left:auto;right:10px;bottom:auto;top:10px}
.side b{font-family:var(--display);font-size:16.5px;line-height:1.15;display:flex;gap:6px;align-items:baseline}
.side b i{width:9px;height:9px;border-radius:50%;background:var(--sc);flex:none;transform:translateY(-1px)}
.side small{font-size:13.5px;color:var(--ink-3);line-height:1.3}
.step.active .side.p{opacity:.62;filter:saturate(.3)}
.step.active .side.g{border-color:var(--win)}
.stamp{position:absolute;left:10px;bottom:9px;font-family:var(--sc);font-weight:700;font-size:13.5px;letter-spacing:.14em;padding:0 8px 2px;border:1.5px solid currentColor;border-radius:3px;line-height:1.35}
.stamp.g{color:var(--win)}.stamp.p{color:var(--lose);transform:rotate(-4deg)}.stamp.m{color:var(--mixed)}.stamp.o{color:var(--ink-3)}
.step.active .stamp{animation:slam .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(.6s + var(--i,0) * .25s)}
@keyframes slam{from{transform:scale(2.6) rotate(-12deg);opacity:0}to{opacity:1}}
.step.active .stamp.p{animation-name:slamp}
@keyframes slamp{from{transform:scale(2.6) rotate(-16deg);opacity:0}to{transform:rotate(-4deg);opacity:1}}

.stat{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:12px}
.stat .num{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.stat .num em{font-style:normal;font-size:.5em;color:var(--ink-2);font-weight:500}
.stat .lab{color:var(--ink-2);font-size:14.5px;flex:1 1 160px}
.price{margin:0;font-size:15px;color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.price::before{content:"";flex:none;width:3px;align-self:stretch;border-radius:2px;background:var(--lose)}
.price b{color:var(--lose);font-weight:700}
.next{margin:0;font-size:14.5px;color:var(--ink-3)}
.next b{color:var(--gold);font-weight:500}
.srcs{margin:0;font-size:12.5px;color:var(--ink-3);line-height:1.5;border-top:1px dashed var(--rule);padding-top:10px}
.srcs a{color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--ink-3);text-underline-offset:2px}
.srcs a:hover{color:var(--gold)}

.play{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#1a1405;border:0;border-radius:999px;padding:10px 20px 10px 16px;font-weight:700;font-size:16px}
.play svg{width:16px;height:16px}
.play:hover{filter:brightness(1.08)}
.fab{position:absolute;right:18px;top:18px;z-index:3;display:inline-flex;align-items:center;gap:8px;background:rgba(20,28,36,.85);border:1px solid var(--rule);border-radius:999px;padding:7px 14px 7px 11px;font-size:14px;color:var(--ink)}
.fab svg{width:13px;height:13px}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend .stamp{position:static;animation:none!important}
.howto{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--ink-2)}
.howto b{color:var(--ink)}

/* specials */
.pres{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pres div{border-radius:6px;padding:8px 8px 7px;background:var(--c);color:#fff;display:flex;flex-direction:column;gap:1px}
.pres b{font-size:13px;font-variant-numeric:tabular-nums}
.pres span{font-size:13px;line-height:1.2;font-weight:500}
.pres .x{grid-column:1/-1;background:transparent;color:var(--ink-3);border:1px dashed var(--ink-3);text-align:center;font-size:13.5px}
.step.active .pres div{animation:rise .45s ease both;animation-delay:calc(.3s + var(--i) * .3s)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bars{display:flex;flex-direction:column;gap:6px}
.bars .row{display:grid;grid-template-columns:118px 1fr 58px;gap:8px;align-items:center;font-size:14.5px}
.bars .bar{height:14px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bars .bar i{display:block;height:100%;width:0;background:var(--c);border-radius:4px;transition:width 1.6s cubic-bezier(.3,.9,.3,1) .4s}
.step.active .bars .bar i{width:var(--w)}
.bars .row b{text-align:right;font-variant-numeric:tabular-nums}
.bars .cap{font-size:12.5px;color:var(--ink-3);font-family:var(--sc);letter-spacing:.08em}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--panel-2);border:1px solid var(--rule);border-radius:7px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile .num{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.05;font-variant-numeric:lining-nums tabular-nums}
.tile span:last-child{font-size:13px;color:var(--ink-2);line-height:1.25}
.resp{display:flex;flex-direction:column;gap:8px}
.resp h3{margin:0;font-family:var(--display);font-size:18px}
.rbar{display:flex;gap:2px;height:22px}
.rbar div{flex:0 0 0%;border-radius:4px;background:var(--c);transition:flex-basis 1.4s cubic-bezier(.3,.9,.3,1)}
.step.active .rbar div{flex-basis:calc(var(--w) - 2px)}
.rleg{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13.5px;color:var(--ink-2)}
.rleg b{color:var(--ink);font-variant-numeric:tabular-nums;margin-right:4px}
.src{font-size:12.5px;color:var(--ink-3);margin:0}
.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* mobile */
@media (max-width:899px){
  .scrolly{display:block}
  .stage{position:sticky;top:env(safe-area-inset-top,0px);height:54svh;z-index:3;border-bottom:1px solid var(--rule)}
  .steps{padding-inline:16px;z-index:1}
  .step{min-height:70svh;align-items:flex-start;padding-block:6svh}
  .step:first-child{min-height:60svh;padding-top:4svh}
  .hud{left:16px;top:58px}
  .hud .year{font-size:42px}
  .tl{left:14px;right:14px;bottom:8px}
  .note{display:none}
  .fab{right:12px;top:12px}
  .card{padding:18px 16px}
  .tlab{font-size:19px}
  .mleg{right:10px;bottom:70px;max-width:72%;padding:7px 9px;font-size:12px;gap:4px}
  .mk .sub{display:none}
  .mleg small{display:none}
  .popup{max-width:230px;font-size:13.5px}
  .hitos button{grid-template-columns:78px minmax(0,1fr)}
}
@media (max-width:420px){ .sides{grid-template-columns:1fr} .sides.three .side{padding-right:10px;padding-bottom:34px} .sides.three .stamp{top:auto;bottom:9px;left:10px;right:auto} }

/* ---- fuentes (botón) ---- */
.fab.left{position:fixed;left:16px;right:auto;top:calc(16px + env(safe-area-inset-top,0px));z-index:25;box-shadow:0 6px 20px rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.fab.left:hover{border-color:var(--gold)}
/* ---- dock de navegación ---- */
.dock{position:absolute;left:24px;right:24px;bottom:16px;z-index:3;display:flex;flex-direction:column;gap:8px;align-items:center}
.segs{position:relative;display:flex;align-items:center;width:100%;max-width:760px;height:18px}
.segs .gap{flex:none;width:9px}
.segs button{flex:1 1 0;min-width:0;height:18px;padding:0 1px;border:0;background:none;display:flex;align-items:center}
.segs button i{display:block;width:100%;height:4px;border-radius:2px;background:#2c3844;transition:background .3s,height .2s,box-shadow .3s}
.segs button.done i{background:color-mix(in srgb,var(--c) 55%,#2c3844)}
.segs button.on i{background:var(--c);height:8px;box-shadow:0 0 12px var(--c)}
.segs button:hover i,.segs button:focus-visible i{height:8px;background:var(--c)}
.segtip{position:absolute;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.3;padding:5px 9px;border-radius:5px;white-space:nowrap;pointer-events:none;max-width:280px;overflow:hidden;text-overflow:ellipsis}
.segtip b{font-variant-numeric:tabular-nums;margin-right:6px}
.dock-row{display:flex;align-items:center;gap:8px;width:100%;max-width:640px}
.nb{width:42px;height:42px;flex:none;border-radius:50%;background:rgba(20,28,36,.92);border:1px solid var(--rule);display:grid;place-items:center;transition:border-color .2s,background .2s}
.nb:hover:not(:disabled){border-color:var(--gold)}
.nb:disabled{opacity:.35;cursor:default}
.nb svg{width:18px;height:18px}
.now{flex:1;min-width:0;height:42px;display:flex;align-items:center;gap:10px;background:rgba(20,28,36,.92);border:1px solid var(--rule);border-radius:999px;padding:0 8px 0 16px;text-align:left;transition:border-color .2s}
.now:hover{border-color:var(--gold)}
.now i{width:9px;height:9px;border-radius:50%;background:var(--ec,var(--gold));flex:none}
.now .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:13px;flex:none}
.now .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:15px}
.now .all{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--bg);background:var(--gold);border-radius:999px;padding:5px 11px;font-weight:700}
.now .all svg{width:13px;height:13px}
/* ---- paneles ---- */
.sheet{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(5,8,12,.74);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.sheet[hidden]{display:none!important}
.sheet .box{width:min(820px,100%);max-height:min(86svh,920px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:sheetIn .28s cubic-bezier(.2,.9,.3,1) both;overflow:hidden}
@keyframes sheetIn{from{opacity:0;transform:translateY(18px) scale(.98)}}
.sheet header{display:flex;align-items:flex-start;gap:14px;padding:20px 20px 14px;border-bottom:1px solid var(--rule)}
.sheet header h2{margin:0;font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05}
.sheet header p{margin:4px 0 0;color:var(--ink-3);font-size:14px}
.sheet .x{margin-left:auto;flex:none;width:40px;height:40px;border-radius:50%;background:var(--panel-2);border:1px solid var(--rule);display:grid;place-items:center}
.sheet .x:hover{border-color:var(--gold)}
.sheet .x svg{width:16px;height:16px}
.sheet .tools{padding:12px 20px 0}
.sheet input[type=search]{width:100%;height:42px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;padding:0 14px}
.sheet input[type=search]:focus{outline:2px solid var(--gold);outline-offset:1px}
.sheet .body{overflow:auto;padding:4px 20px 22px;overscroll-behavior:contain}
.grp h3{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-family:var(--sc);font-weight:500;font-size:14.5px;letter-spacing:.1em;color:var(--ink-2)}
.chlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.chlist button{text-align:left;background:var(--panel-2);border:1px solid var(--rule);border-radius:9px;padding:9px 12px 10px;display:flex;flex-direction:column;gap:3px;transition:border-color .2s,transform .2s}
.chlist button:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.chlist button.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.chlist .y{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.chlist .y i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chlist b{font-family:var(--display);font-size:16.5px;line-height:1.2}
.srcgrp{padding:14px 0 12px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 18px}
.srcgrp .when{font-size:12.5px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;padding-top:3px}
.srcgrp h4{margin:0 0 6px;font-family:var(--display);font-size:17px;line-height:1.2}
.srcgrp h4 button{background:none;border:0;padding:0;text-align:left;font:inherit;color:var(--ink)}
.srcgrp h4 button:hover{color:var(--gold)}
.srcgrp ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.srcgrp li a{display:inline;font-size:14.5px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--ink-3);text-underline-offset:3px}
.srcgrp li a:hover{color:var(--gold)}
.srcgrp li small{display:block;color:var(--ink-3);font-size:12px;word-break:break-all}
.srcnote{margin:16px 0 0;font-size:13.5px;color:var(--ink-3);line-height:1.5}
.empty{padding:24px 0;color:var(--ink-3)}
@media (max-width:899px){
  .dock{left:10px;right:10px;bottom:8px;gap:4px}
  .segs{height:14px}.segs button{height:14px}
  .nb{width:36px;height:36px}
  .now{height:36px;padding:0 5px 0 12px;gap:8px}
  .now .t{font-size:14px}
  .now .all span{display:none}
  .now .all{padding:5px 8px}
  .fab.left{left:12px;top:calc(12px + env(safe-area-inset-top,0px))}
  .srcgrp{grid-template-columns:1fr}
  .sheet{padding:0;place-items:end stretch}
  .sheet .box{width:100%;max-height:88svh;border-radius:16px 16px 0 0}
}

/* ---- epílogo ---- */
#flag{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.4s ease}
.stage.outro #flag{opacity:1}
.stage.outro #countries path{fill-opacity:.22;stroke-opacity:.35}
.stage.outro #countries path.col{fill:transparent;fill-opacity:0;stroke:var(--gold);stroke-opacity:1;stroke-width:calc(var(--sw,1) * 2.2px);filter:drop-shadow(0 0 6px rgba(232,185,62,.6))}
.stage.outro .hud,.stage.outro .mleg,.stage.outro .note{opacity:0;pointer-events:none}
.hud{transition:opacity .6s}
.quote{position:absolute;left:clamp(20px,4vw,48px);top:clamp(64px,9vh,96px);max-width:min(560px,70%);pointer-events:none;opacity:0;transform:translateY(14px);transition:opacity 1.2s ease .5s, transform 1.2s ease .5s;z-index:2}
.stage.outro .quote{opacity:1;transform:none}
.quote p{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(34px,4.6vw,66px);line-height:1.02;letter-spacing:-.01em;text-wrap:balance;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.75),0 0 2px rgba(0,0,0,.6)}
.quote em{font-style:italic;font-weight:500;color:var(--gold)}
.quote span{display:block;margin-top:12px;font-size:14px;color:var(--ink-2);text-shadow:0 1px 8px rgba(0,0,0,.8)}
.card.outro h2{font-size:clamp(30px,3vw,40px);line-height:1.05}
.card.outro h2 em{font-style:italic;font-weight:500;color:var(--gold)}
.card.outro .attr{margin:-6px 0 0;font-size:13.5px;color:var(--ink-3)}
.flagbar{display:flex;height:10px;border-radius:3px;overflow:hidden}
.flagbar i{display:block}
.rimas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.rimas li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;padding:9px 2px;border-bottom:1px solid var(--rule);font-size:14.5px;line-height:1.4}
.rimas b{color:var(--gold);font-size:13px;font-variant-numeric:tabular-nums}
.step.active .rimas li{animation:rise .5s ease both;animation-delay:calc(.4s + var(--i) * .2s)}
.again{align-self:flex-start;background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px}
.again:hover{background:var(--gold);color:#1a1405}
@media (max-width:899px){ .quote{top:52px;max-width:88%} .quote p{font-size:28px} .quote span{font-size:12px;margin-top:6px} .rimas li{grid-template-columns:1fr;gap:2px} }

.stage.outro{position:fixed;inset:0;top:0;width:100%;height:100svh;z-index:10;border:0}
.card.outro{visibility:hidden}
.quote .again{pointer-events:none;margin-top:22px;background:rgba(13,19,25,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.stage.outro .quote .again{pointer-events:auto}
@media (max-width:899px){ .stage.outro{height:100svh} .quote .again{margin-top:14px;font-size:14px;padding:7px 14px} }

/* ---- fotos de archivo ---- */
.ph{margin:0 -4px;display:flex;flex-direction:column;gap:6px}
.ph img{display:block;width:100%;max-height:230px;object-fit:cover;border-radius:7px;border:1px solid var(--rule);filter:sepia(.18) contrast(1.03);background:var(--panel-2)}
.ph figcaption{font-size:12px;color:var(--ink-3)}
.ph figcaption a{color:var(--ink-2)}
/* ---- personajes ---- */
.ppl .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pchip{display:inline-flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--rule);border-radius:999px;padding:3px 12px 3px 3px;font-size:14px;transition:border-color .2s}
.pchip:hover{border-color:var(--pc)}
.av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#0d1319;background:var(--pc) center/cover no-repeat;box-shadow:0 0 0 2px var(--panel-2),0 0 0 3.5px var(--pc)}
.av.img{color:transparent}
.pbox header{align-items:center}
.pphoto{width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:28px;color:#0d1319;background:var(--pc) center/cover no-repeat;box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--pc)}
.pphoto.img{color:transparent}
.pbody{display:flex;flex-direction:column;gap:14px;padding-top:14px!important}
.prole{margin:0;font-size:17px;line-height:1.5}
.pextract{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.5;border-left:3px solid var(--rule);padding-left:12px}
.pextract:empty{display:none}
.pmeta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13.5px;color:var(--ink-3)}
.pmeta a{color:var(--gold)}
/* ---- escala de víctimas ---- */
:root{--q1:#5e3236;--q2:#80353a;--q3:#97363a;--q4:#c04441;--q5:#e2604e;--q6:#ff8a66}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}
}

const initials = n => n.replace(/«.*?»/g,"").split(/\s+/).filter(w=>/^[A-ZÁÉÍÓÚÑ]/.test(w)).slice(0,2).map(w=>w[0]).join("");
const WK={};
function wiki(t){
  if(!(t in WK)) WK[t]=fetch(`https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t)}`,{headers:{"Api-User-Agent":"colombia-en-disputa (GitHub Pages)"}})
    .then(r=>r.ok?r.json():null).catch(()=>null);
  return WK[t];
}
const pickImg = s => s && (s.originalimage && s.originalimage.width<=1600 ? s.originalimage.source : s.thumbnail && s.thumbnail.source);
function loadMedia(stepEl){
  if(!stepEl || stepEl.dataset.media) return; stepEl.dataset.media="1";
  stepEl.querySelectorAll("figure.ph[data-wiki]").forEach(f=>{
    wiki(f.dataset.wiki).then(s=>{ const src=pickImg(s); if(!src) return;
      const img=f.querySelector("img"); img.onload=()=>{ f.hidden=false; }; img.src=src; img.alt=s.title||"";
      const url=s.content_urls&&s.content_urls.desktop&&s.content_urls.desktop.page;
      f.querySelector("figcaption").innerHTML=`Imagen del artículo <a href="${url}" target="_blank" rel="noopener">«${esc(s.title)}»</a> · Wikimedia Commons`; });
  });
  stepEl.querySelectorAll("[data-av]").forEach(av=>{
    const p=PPL[av.dataset.av]; wiki(p.w).then(s=>{ const src=s&&s.thumbnail&&s.thumbnail.source; if(!src) return;
      const im=new Image(); im.onload=()=>{ av.style.backgroundImage=`url("${src}")`; av.classList.add("img"); }; im.src=src; });
  });
}

const COL=GEO.features.find(f=>f.id==="170"), COLP=new Path2D(path(COL)), COLB=path.bounds(COL);

function drawFlag(x0,y0,w,h,t,amp,alpha){
  const step=Math.max(3,Math.round(w/140));

    const u=x/w, ph=u*Math.PI*3.2 - t*0.0021, dy=Math.sin(ph)*amp*(0.3+0.7*u), sh=Math.cos(ph)*(0.3+0.7*u);

    const Y=Math.round(y0+dy), y1=Math.round(y0+dy+h*.5), y2=Math.round(y0+dy+h*.75), y3=Math.round(y0+dy+h);
    const lt=Math.round(128+sh*(sh>0?40:95)), k=v=>Math.max(0,Math.min(255,Math.round(v*lt/128)));
    fctx.fillStyle=`rgb(${k(252)},${k(209)},${k(22)})`; fctx.fillRect(X,Y,sw,y1-Y);
    fctx.fillStyle=`rgb(${k(0)},${k(56)},${k(147)})`; fctx.fillRect(X,y1,sw,y2-y1);
    fctx.fillStyle=`rgb(${k(206)},${k(17)},${k(38)})`; fctx.fillRect(X,y2,sw,y3-y2);
  }

}

  drawFlag(-30,-30,W+60,H+60,t,22,0.3);
  const [[bx0,by0],[bx1,by1]]=COLB, sx0=bx0*view.k+view.x, sy0=by0*view.k+view.y, sw=(bx1-bx0)*view.k, sh=(by1-by0)*view.k;
  fctx.save(); fctx.setTransform(dpr*view.k,0,0,dpr*view.k,dpr*view.x,dpr*view.y); fctx.clip(COLP); fctx.setTransform(dpr,0,0,dpr,0,0);
  drawFlag(sx0-sw*.08,sy0-sh*.06,sw*1.16,sh*1.12,t*1.1,sh*.035,1);
  fctx.restore();
  if(flagOn && !RM) flagRaf=requestAnimationFrame(flagFrame);
}
function setFlag(on){
  if(on===flagOn) return; flagOn=on; cancelAnimationFrame(flagRaf);
  if(on) flagRaf=requestAnimationFrame(flagFrame);
}
document.addEventListener("click",e=>{ if(e.target.closest("[data-restart]")) goTo(0); });

let mediaT=0;
function setChapter(i, instant){
  if(i===cur) return; hidePopup(true); cur=i; const c=C[i];
  steps.forEach((s,j)=>s.classList.toggle("active",j===i));
  const era=ERA[c.era]; $("#era").style.setProperty("--ec",`var(${era.c})`); $("#era span").textContent=c.intro?"un recorrido visual":era.l;
  countYear(c);
  updateDock(i); updateFab(i); clearTimeout(mediaT); mediaT=setTimeout(()=>{ loadMedia(steps[i]); loadMedia(steps[i+1]); },450);
  stage.classList.toggle("outro",!!c.outro); setFlag(!!c.outro); dims();
  const T=c.terr||{};
  for(const id in countryEl){ countryEl[id].classList.remove("col","ghost","lost"); }
  (T.col||[]).forEach(id=>countryEl[id]?.classList.add("col"));
  (T.ghost||[]).forEach(id=>countryEl[id]?.classList.add("ghost"));
  (T.lost||[]).forEach(id=>{ const n=countryEl[id]; if(!n) return; void n.getBoundingClientRect(); n.classList.add("lost"); });
  setLayer(c);
  flyTo(fit(V[c.v]), instant);
  clearLayers();
  const base=instant?0:.9;
  if(!c.outro) for(const [l,p] of LABELS){ const g=mk("g",{class:"fadein",style:`animation-delay:${base}s`},gOV); const t=mk("text",{class:"clab","text-anchor":"middle"},g); t.textContent=l; ovAdd(p,g); }
  if(c.lay && c.lay.labels) for(const [l,p] of c.lay.labels){ const g=mk("g",{class:"fadein",style:`animation-delay:${base+.4}s`},gOV); const t=mk("text",{class:"slab","text-anchor":"middle"},g); t.textContent=l; ovAdd(p,g); }
  if(c.tl){ const g=mk("g",{class:"fadein",style:`animation-delay:${base+.3}s`},gOV); const t=mk("text",{class:"tlab","text-anchor":"middle"},g); t.textContent=c.tl.l; ovAdd(c.tl.p,g); }
  if(c.area){ const circle=d3.geoCircle().center(c.area.p).radius(c.area.r)(); const n=mk("path",{d:path(circle),class:"area",style:`animation-delay:${base}s${c.area.lose?";fill:rgba(239,107,97,.18);stroke:var(--lose)":""}`},gFX); fxNodes.push(n); }
  (c.rt||[]).forEach(r=>{
    const pts=r.pts.map(p=>proj(p)), d=d3.line().curve(d3.curveCatmullRom.alpha(.5))(pts);
    const dur=r.dur||2.6, delay=base+(r.d||0);
    const sh=mk("path",{d,class:"route-shadow",pathLength:1,style:`--dur:${dur}s;--delay:${delay}s`},gFX);
    const n=mk("path",{d,class:"route",pathLength:1,stroke:`var(${r.c})`,style:`--dur:${dur}s;--delay:${delay}s`},gFX);
    fxNodes.push(sh,n);
    if(!RM){ const dot=mk("circle",{r:4/view.k,class:"traveler",opacity:0},gFX); fxNodes.push(dot);
      const tr={dot,cancel:false}; travelers.push(tr);
      const L=n.getTotalLength(), t0=performance.now()+delay*1000;
      const tick=now=>{ if(tr.cancel) return; const t=(now-t0)/(dur*1000);
        if(t>=0){ const e=d3.easeCubicInOut(Math.min(1,t)); const q=n.getPointAtLength(L*e); dot.setAttribute("cx",q.x); dot.setAttribute("cy",q.y); dot.setAttribute("opacity",t>=1?0:1); }
        if(t<1) requestAnimationFrame(tick); };
      requestAnimationFrame(tick); }
  });
  (c.mk||[]).forEach(m=>drawMarker(m,base));
  const evBase = base + (c.rt ? 0.6 : 0);
  (c.ev||[]).forEach((e,j)=>{
    if(!e.p) return;
    const g=drawMarker({p:e.p,k:e.k||"ev",c:e.c||"--gold",l:e.nl?null:e.l,s:e.nl?null:e.d,a:e.a,d:j*.35},evBase);
    g.classList.add("ev-mk"); g.dataset.j=j;
    mk("circle",{r:16,class:"hit"},g);
    evEls[j]=ovItems[ovItems.length-1];
  });
  steps[i].querySelectorAll("[data-count]").forEach(el=>countUp(el));
}
function countUp(el){
  const v=+el.dataset.count;
  if(RM){ el.textContent=fmt(v); return; }
  const t0=performance.now()+500, dur=1600;
  const tick=now=>{ const t=Math.max(0,Math.min(1,(now-t0)/dur)), e=1-Math.pow(1-t,3); el.textContent=fmt(v*e); if(t<1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
let yearNow=1499, yRaf=0;
function countYear(c){
  const el=$("#year"), to=c.y, from=yearNow, tail=c.y2?`<small>–${c.y2}</small>`:"";
  cancelAnimationFrame(yRaf);
  if(c.yl){ el.innerHTML = /^antes/.test(c.yl)? `1499<small>y antes</small>` : /^\d/.test(c.yl) ? esc(c.yl) : `${to}<small>${esc(c.yl)}</small>`; yearNow=to; return; }
  if(RM||from===to){ el.innerHTML=to+tail; yearNow=to; return; }
  const t0=performance.now(), dur=900;
  const tick=now=>{ const t=Math.min(1,(now-t0)/dur), e=d3.easeCubicOut(t); el.innerHTML=Math.round(from+(to-from)*e)+tail; if(t<1) yRaf=requestAnimationFrame(tick); };
  yRaf=requestAnimationFrame(tick); yearNow=to;
}

/* ---------------- scroll ---------------- */
function trigger(){ return innerWidth<900 ? innerHeight*0.72 : innerHeight*0.55; }
function onScroll(){
  const tY=trigger(); let idx=0;
  steps.forEach((s,i)=>{ if(s.getBoundingClientRect().top < tY) idx=i; });
  setChapter(idx);
}
function goTo(i, again){
  const card=steps[i].querySelector(".card"), r=card.getBoundingClientRect(), mob=innerWidth<900;
  const top = mob ? r.top+scrollY - (stage.offsetHeight+16) : r.top+scrollY - Math.max(76,(innerHeight-r.height)/2);
  scrollTo({top:Math.max(0,Math.min(top, r.top+scrollY - (mob?16:76))),behavior:(RM||again)?"auto":"smooth"});
  if(!again){ clearTimeout(goT); goT=setTimeout(()=>{ if(cur!==i) goTo(i,true); },1100); }
}
let goT=0;
addEventListener("scroll",()=>requestAnimationFrame(()=>window.__noscroll||onScroll()),{passive:true});
addEventListener("resize",()=>{ dims(); applyView(fit(V[C[Math.max(cur,0)].v])); if(flagOn && RM) flagFrame(0); });

/* ---------------- play ---------------- */
const playing=false; function setPlaying(){}
const ARROW='<path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>';
const RESTART='<path d="M3.5 8a4.5 4.5 0 1 0 1.4-3.3M3.5 2.5v2.8h2.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';
function updateFab(i){
  const last = i>=C.length-1;
  $("#fab span").textContent = i===0 ? "Empezar" : last ? "Volver al inicio" : "Siguiente";
  $("#fabIcon").innerHTML = last ? RESTART : ARROW;
  $("#fab").setAttribute("aria-label", last ? "Volver al inicio" : "Ir al capítulo siguiente");
}
$("#fab").onclick=()=>goTo(cur>=C.length-1 ? 0 : cur+1);
$("#play").onclick=()=>goTo(1);

/* ---------------- boot ---------------- */
dims(); applyView(fit(V.col)); setChapter(0,true); onScroll();

</script>
